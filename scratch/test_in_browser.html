<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="output"></div>
<script>
const xml = `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE eagle SYSTEM "eagle.dtd">
<eagle version="9.7.0">
<drawing>
<board>
<elements>
<element name="R1" library="Tinkercad" package="RESAD1016W63L850D250B" value="2k" x="53.6802" y="73.5617"/>
<element name="P1" library="Tinkercad" package="BATTERY-GENERIC" value="BATTERYGENERIC" x="8.255" y="8.255" rot="R180"/>
</elements>
<signals>
<signal name="P1+">
<contactref element="R1" pad="1"/>
<contactref element="P1" pad="+"/>
</signal>
</signals>
</board>
</drawing>
</eagle>`;

try {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'application/xml');
  const pErr = doc.querySelector('parsererror');
  const qElements = doc.querySelectorAll('elements > element');
  const tagElements = doc.getElementsByTagName('element');

  const out = {
    parserError: pErr ? pErr.textContent : null,
    qElementsCount: qElements.length,
    tagElementsCount: tagElements.length
  };
  document.getElementById('output').textContent = JSON.stringify(out, null, 2);
} catch (e) {
  document.getElementById('output').textContent = 'ERROR: ' + e.message;
}
</script>
</body>
</html>
